name: Terraria XEX static analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/input/game.exe.xex'
      - '.github/workflows/terraria-xex-analysis.yml'
      - 'tools/report_assembly_refs.py'
      - 'tools/report_controller_bindings.py'
      - 'tools/report_menu_integration_points.py'
      - 'tools/report_menu_render_context.py'
      - 'tools/report_pause_menu_capacity.py'
      - 'tools/report_ui_raw_il.py'

permissions:
  contents: read

jobs:
  extract-game-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T360 ModLoader
        uses: actions/checkout@v4

      - name: Verify input copy
        shell: bash
        run: |
          test -s research/input/game.exe.xex || {
            echo "Missing research/input/game.exe.xex"
            echo "Upload a COPY of the extracted Terraria game.exe.xex to this path."
            exit 1
          }
          sha256sum research/input/game.exe.xex

      - name: Checkout XexTool-RE
        uses: actions/checkout@v4
        with:
          repository: mrtitanic777/XexTool-RE
          ref: main
          path: tools/XexTool-RE

      - name: Build XexTool-RE CLI
        run: make -C tools/XexTool-RE cli

      - name: Inspect and extract basefile
        shell: bash
        run: |
          mkdir -p research/output
          TOOL="$GITHUB_WORKSPACE/tools/XexTool-RE/xextool-re.exe"
          INPUT="$GITHUB_WORKSPACE/research/input/game.exe.xex"
          test -x "$TOOL" || {
            echo "XexTool-RE CLI not found at: $TOOL"
            echo "Contents of tools/XexTool-RE:"
            ls -la tools/XexTool-RE
            exit 1
          }
          "$TOOL" info "$INPUT" 2>&1 | tee research/output/info.txt
          "$TOOL" list "$INPUT" 2>&1 | tee research/output/list.txt
          "$TOOL" extract "$INPUT" "$GITHUB_WORKSPACE/research/output/game.exe.basefile" 2>&1 | tee research/output/extract.txt
          file research/output/game.exe.basefile | tee research/output/file-type.txt
          sha256sum research/output/game.exe.basefile | tee research/output/sha256.txt
          test "$(head -c 2 research/output/game.exe.basefile)" = "MZ"

      - name: Extract embedded Terraria managed assembly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          source = Path("research/output/game.exe.basefile")
          data = source.read_bytes()

          def u16(buf, off):
              return struct.unpack_from("<H", buf, off)[0]

          def u32(buf, off):
              return struct.unpack_from("<I", buf, off)[0]

          def map_rva(rva, sections, image_start):
              for name, virtual_size, virtual_address, raw_size, raw_pointer in sections:
                  span = max(virtual_size, raw_size)
                  if virtual_address <= rva < virtual_address + span:
                      delta = rva - virtual_address
                      if delta >= raw_size:
                          raise ValueError(f"RVA 0x{rva:x} points outside raw section {name}")
                      return image_start + raw_pointer + delta
              raise ValueError(f"RVA 0x{rva:x} is not mapped by a section")

          candidates = []
          pos = 0
          while True:
              pos = data.find(b"MZ", pos)
              if pos < 0:
                  break
              try:
                  if pos + 0x40 > len(data):
                      raise ValueError("truncated DOS header")
                  pe_rel = u32(data, pos + 0x3c)
                  pe = pos + pe_rel
                  if pe + 24 > len(data) or data[pe:pe+4] != b"PE\0\0":
                      raise ValueError("invalid PE signature")
                  machine = u16(data, pe + 4)
                  section_count = u16(data, pe + 6)
                  optional_size = u16(data, pe + 20)
                  optional = pe + 24
                  if machine != 0x014c or u16(data, optional) != 0x010b:
                      raise ValueError("not an x86 PE32 image")
                  if optional + optional_size > len(data):
                      raise ValueError("truncated optional header")
                  directory_count = u32(data, optional + 92)
                  if directory_count <= 14:
                      raise ValueError("no CLR data directory")
                  clr_rva, clr_size = struct.unpack_from("<II", data, optional + 96 + 14 * 8)
                  if not clr_rva or clr_size < 0x48:
                      raise ValueError("no valid CLR directory")
                  section_table = optional + optional_size
                  sections = []
                  max_raw_end = u32(data, optional + 60)
                  for i in range(section_count):
                      s = section_table + i * 40
                      if s + 40 > len(data):
                          raise ValueError("truncated section table")
                      name = data[s:s+8].split(b"\0", 1)[0].decode("ascii", "replace")
                      virtual_size, virtual_address, raw_size, raw_pointer = struct.unpack_from("<IIII", data, s + 8)
                      if raw_pointer + raw_size > len(data) - pos:
                          raise ValueError(f"section {name} exceeds source file")
                      sections.append((name, virtual_size, virtual_address, raw_size, raw_pointer))
                      max_raw_end = max(max_raw_end, raw_pointer + raw_size)
                  clr_off = map_rva(clr_rva, sections, pos)
                  metadata_rva, metadata_size = struct.unpack_from("<II", data, clr_off + 8)
                  metadata_off = map_rva(metadata_rva, sections, pos)
                  if data[metadata_off:metadata_off+4] != b"BSJB":
                      raise ValueError("CLR metadata signature BSJB not found")
                  if metadata_size <= 0 or metadata_off + metadata_size > len(data):
                      raise ValueError("invalid CLR metadata size")
                  image = data[pos:pos+max_raw_end]
                  candidates.append((pos, image, machine, clr_rva, metadata_rva, metadata_size))
              except (ValueError, struct.error):
                  pass
              pos += 2

          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one embedded managed x86 assembly; found {len(candidates)}")

          offset, image, machine, clr_rva, metadata_rva, metadata_size = candidates[0]
          output = Path("research/output/Terraria.Managed.dll")
          output.write_bytes(image)
          digest = hashlib.sha256(image).hexdigest()
          report = (
              "Embedded managed assembly extraction: PASS\n"
              f"Source: {source}\n"
              f"Embedded PE offset: 0x{offset:x}\n"
              f"Machine: 0x{machine:04x} (x86)\n"
              f"CLR header RVA: 0x{clr_rva:x}\n"
              f"Metadata RVA: 0x{metadata_rva:x}\n"
              f"Metadata size: {metadata_size} bytes\n"
              "Metadata signature: BSJB\n"
              f"Output: {output}\n"
              f"Size: {len(image)} bytes\n"
              f"SHA-256: {digest}\n"
          )
          Path("research/output/managed-assembly.txt").write_text(report, encoding="utf-8")
          Path("research/output/managed-assembly.sha256").write_text(
              f"{digest}  {output}\n", encoding="utf-8"
          )
          print(report)
          PY
          file research/output/Terraria.Managed.dll | tee research/output/managed-file-type.txt
          test "$(head -c 2 research/output/Terraria.Managed.dll)" = "MZ"

      - name: Set up .NET 10 for ILSpy
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install ILSpy command-line decompiler
        run: dotnet tool install ilspycmd --tool-path tools/ilspy --version 11.1.0.9782

      - name: List Terraria managed types
        shell: bash
        run: |
          tools/ilspy/ilspycmd -l c research/output/Terraria.Managed.dll 2>&1 | tee research/output/managed-types.txt

      - name: Decompile Terraria managed assembly
        shell: bash
        run: |
          tools/ilspy/ilspycmd --disable-updatecheck -p --nested-directories -o research/output/decompiled research/output/Terraria.Managed.dll
          find research/output/decompiled -type f | sort > research/output/decompiled-files.txt
          printf "Decompiled files: " >> research/output/decompilation-summary.txt
          find research/output/decompiled -type f -name '*.cs' | wc -l >> research/output/decompilation-summary.txt
          du -sh research/output/decompiled >> research/output/decompilation-summary.txt

      - name: Inventory Terraria controller bindings
        shell: bash
        run: |
          python3 tools/report_controller_bindings.py research/output/decompiled \
            --json research/output/controller-bindings.json \
            --markdown research/output/controller-bindings.md

      - name: Map Terraria menu integration points
        shell: bash
        run: |
          python3 tools/report_menu_integration_points.py research/output/decompiled \
            --json research/output/menu-integration-points.json \
            --markdown research/output/menu-integration-points.md

      - name: Verify menu render context
        shell: bash
        run: |
          python3 tools/report_menu_render_context.py research/output/decompiled \
            --json research/output/menu-render-context.json \
            --markdown research/output/menu-render-context.md

      - name: Audit pause menu extension capacity
        shell: bash
        run: |
          python3 tools/report_pause_menu_capacity.py research/output/decompiled \
            --json research/output/pause-menu-capacity.json \
            --markdown research/output/pause-menu-capacity.md

      - name: Capture raw IL for Terraria.UI
        shell: bash
        run: |
          tools/ilspy/ilspycmd --ilcode --type Terraria.UI research/output/Terraria.Managed.dll \
            > research/output/Terraria-UI.il
          test -s research/output/Terraria-UI.il
          python3 tools/report_ui_raw_il.py research/output/Terraria-UI.il \
            --json research/output/ui-raw-il.json \
            --markdown research/output/ui-raw-il.md

      - name: Inventory managed build references
        shell: bash
        run: |
          PROJECT="$(find research/output/decompiled -type f -name '*.csproj' -print -quit)"
          test -n "$PROJECT" || {
            echo "ILSpy-generated project file was not found."
            exit 1
          }
          python3 tools/report_managed_build_requirements.py "$PROJECT" \
            --json research/output/managed-build-requirements.json \
            --markdown research/output/managed-build-requirements.md

      - name: Read exact CLR AssemblyRef identities
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check dnfile==0.15.1
          python3 tools/report_assembly_refs.py research/output/Terraria.Managed.dll \
            --json research/output/managed-assembly-refs.json \
            --markdown research/output/managed-assembly-refs.md

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraria-game-exe-analysis
          path: research/output/
          if-no-files-found: warn
          retention-days: 7
