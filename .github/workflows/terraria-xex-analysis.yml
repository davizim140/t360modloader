name: Terraria XEX static analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/input/game.exe.xex'
      - '.github/workflows/terraria-xex-analysis.yml'
      - 'tools/report_assembly_refs.py'
      - 'tools/report_controller_bindings.py'
      - 'tools/report_menu_integration_points.py'
      - 'tools/report_menu_render_context.py'
      - 'tools/report_pause_menu_capacity.py'
      - 'tools/report_ui_raw_il.py'
      - 'tools/audit_pause_menu_il.py'
      - 'tools/managed-assembly-inventory/**'
      - 'tools/managed-roundtrip/**'
      - 'tools/managed-maxstack-audit/**'
      - 'tools/pause-menu-target-audit/**'
      - 'tools/pause-menu-patch-planner/**'
      - 'tools/pause-coordinate-patch/**'
      - 'tools/pause-height-audit/**'
      - 'tools/pause-label-audit/**'
      - 'tools/pause-selection-audit/**'
      - 'tools/pause-menu-integration-patch/**'
      - 'tools/xextool-re-page-hash-patch/**'
      - 'tools/verify_xex_page_hashes.py'
      - 'tools/audit_pause_selection.py'

permissions:
  contents: read

jobs:
  extract-game-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T360 ModLoader
        uses: actions/checkout@v4

      - name: Verify input copy
        shell: bash
        run: |
          test -s research/input/game.exe.xex || {
            echo "Missing research/input/game.exe.xex"
            echo "Upload a COPY of the extracted Terraria game.exe.xex to this path."
            exit 1
          }
          sha256sum research/input/game.exe.xex

      - name: Checkout XexTool-RE
        uses: actions/checkout@v4
        with:
          repository: mrtitanic777/XexTool-RE
          ref: main
          path: tools/XexTool-RE

      - name: Add T360 page-hash rebuild support to XexTool-RE
        run: python3 tools/xextool-re-page-hash-patch/apply_patch.py

      - name: Build XexTool-RE CLI
        run: make -C tools/XexTool-RE cli

      - name: Inspect and extract basefile
        shell: bash
        run: |
          mkdir -p research/output
          TOOL="$GITHUB_WORKSPACE/tools/XexTool-RE/xextool-re.exe"
          INPUT="$GITHUB_WORKSPACE/research/input/game.exe.xex"
          test -x "$TOOL" || {
            echo "XexTool-RE CLI not found at: $TOOL"
            echo "Contents of tools/XexTool-RE:"
            ls -la tools/XexTool-RE
            exit 1
          }
          "$TOOL" info "$INPUT" 2>&1 | tee research/output/info.txt
          "$TOOL" list "$INPUT" 2>&1 | tee research/output/list.txt
          "$TOOL" extract "$INPUT" "$GITHUB_WORKSPACE/research/output/game.exe.basefile" 2>&1 | tee research/output/extract.txt
          file research/output/game.exe.basefile | tee research/output/file-type.txt
          sha256sum research/output/game.exe.basefile | tee research/output/sha256.txt
          test "$(head -c 2 research/output/game.exe.basefile)" = "MZ"

      - name: Verify original XEX page hashes and no-op rebuild round-trip
        shell: bash
        run: |
          TOOL="$GITHUB_WORKSPACE/tools/XexTool-RE/xextool-re.exe"
          INPUT="$GITHUB_WORKSPACE/research/input/game.exe.xex"
          BASE="$GITHUB_WORKSPACE/research/output/game.exe.basefile"
          "$TOOL" replace-basefile "$INPUT" "$BASE" "$GITHUB_WORKSPACE/research/output/game.exe.pagehash-smoke.xex"
          "$TOOL" extract "$GITHUB_WORKSPACE/research/output/game.exe.pagehash-smoke.xex" "$GITHUB_WORKSPACE/research/output/game.exe.pagehash-smoke.basefile"
          python3 tools/verify_xex_page_hashes.py "$INPUT" "$BASE" | tee research/output/source-page-hash-verification.txt
          python3 tools/verify_xex_page_hashes.py research/output/game.exe.pagehash-smoke.xex research/output/game.exe.pagehash-smoke.basefile | tee research/output/rebuilt-page-hash-verification.txt
          cmp "$BASE" research/output/game.exe.pagehash-smoke.basefile
          echo "NO-OP XEX BASEFILE ROUND-TRIP: PASS" | tee research/output/xex-rebuild-smoke.txt

      - name: Extract embedded Terraria managed assembly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          source = Path("research/output/game.exe.basefile")
          data = source.read_bytes()

          def u16(buf, off):
              return struct.unpack_from("<H", buf, off)[0]

          def u32(buf, off):
              return struct.unpack_from("<I", buf, off)[0]

          def map_rva(rva, sections, image_start):
              for name, virtual_size, virtual_address, raw_size, raw_pointer in sections:
                  span = max(virtual_size, raw_size)
                  if virtual_address <= rva < virtual_address + span:
                      delta = rva - virtual_address
                      if delta >= raw_size:
                          raise ValueError(f"RVA 0x{rva:x} points outside raw section {name}")
                      return image_start + raw_pointer + delta
              raise ValueError(f"RVA 0x{rva:x} is not mapped by a section")

          candidates = []
          pos = 0
          while True:
              pos = data.find(b"MZ", pos)
              if pos < 0:
                  break
              try:
                  if pos + 0x40 > len(data):
                      raise ValueError("truncated DOS header")
                  pe_rel = u32(data, pos + 0x3c)
                  pe = pos + pe_rel
                  if pe + 24 > len(data) or data[pe:pe+4] != b"PE\0\0":
                      raise ValueError("invalid PE signature")
                  machine = u16(data, pe + 4)
                  section_count = u16(data, pe + 6)
                  optional_size = u16(data, pe + 20)
                  optional = pe + 24
                  if machine != 0x014c or u16(data, optional) != 0x010b:
                      raise ValueError("not an x86 PE32 image")
                  if optional + optional_size > len(data):
                      raise ValueError("truncated optional header")
                  directory_count = u32(data, optional + 92)
                  if directory_count <= 14:
                      raise ValueError("no CLR data directory")
                  clr_rva, clr_size = struct.unpack_from("<II", data, optional + 96 + 14 * 8)
                  if not clr_rva or clr_size < 0x48:
                      raise ValueError("no valid CLR directory")
                  section_table = optional + optional_size
                  sections = []
                  max_raw_end = u32(data, optional + 60)
                  for i in range(section_count):
                      s = section_table + i * 40
                      if s + 40 > len(data):
                          raise ValueError("truncated section table")
                      name = data[s:s+8].split(b"\0", 1)[0].decode("ascii", "replace")
                      virtual_size, virtual_address, raw_size, raw_pointer = struct.unpack_from("<IIII", data, s + 8)
                      if raw_pointer + raw_size > len(data) - pos:
                          raise ValueError(f"section {name} exceeds source file")
                      sections.append((name, virtual_size, virtual_address, raw_size, raw_pointer))
                      max_raw_end = max(max_raw_end, raw_pointer + raw_size)
                  clr_off = map_rva(clr_rva, sections, pos)
                  metadata_rva, metadata_size = struct.unpack_from("<II", data, clr_off + 8)
                  metadata_off = map_rva(metadata_rva, sections, pos)
                  if data[metadata_off:metadata_off+4] != b"BSJB":
                      raise ValueError("CLR metadata signature BSJB not found")
                  if metadata_size <= 0 or metadata_off + metadata_size > len(data):
                      raise ValueError("invalid CLR metadata size")
                  image = data[pos:pos+max_raw_end]
                  candidates.append((pos, image, machine, clr_rva, metadata_rva, metadata_size))
              except (ValueError, struct.error):
                  pass
              pos += 2

          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one embedded managed x86 assembly; found {len(candidates)}")

          offset, image, machine, clr_rva, metadata_rva, metadata_size = candidates[0]
          output = Path("research/output/Terraria.Managed.dll")
          output.write_bytes(image)
          digest = hashlib.sha256(image).hexdigest()
          report = (
              "Embedded managed assembly extraction: PASS\n"
              f"Source: {source}\n"
              f"Embedded PE offset: 0x{offset:x}\n"
              f"Machine: 0x{machine:04x} (x86)\n"
              f"CLR header RVA: 0x{clr_rva:x}\n"
              f"Metadata RVA: 0x{metadata_rva:x}\n"
              f"Metadata size: {metadata_size} bytes\n"
              "Metadata signature: BSJB\n"
              f"Output: {output}\n"
              f"Size: {len(image)} bytes\n"
              f"SHA-256: {digest}\n"
          )
          Path("research/output/managed-assembly.txt").write_text(report, encoding="utf-8")
          Path("research/output/managed-assembly.sha256").write_text(
              f"{digest}  {output}\n", encoding="utf-8"
          )
          print(report)
          PY
          file research/output/Terraria.Managed.dll | tee research/output/managed-file-type.txt
          test "$(head -c 2 research/output/Terraria.Managed.dll)" = "MZ"

      - name: Set up .NET 10 for ILSpy
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read-only Mono.Cecil inventory of Terraria assembly
        shell: bash
        run: |
          dotnet run --project tools/managed-assembly-inventory/ManagedAssemblyInventory.csproj -- \
            research/output/Terraria.Managed.dll \
            --output research/output/managed-cecil-inventory.json

      - name: Verify real Terraria separate-copy round-trip
        shell: bash
        run: |
          dotnet run --project tools/managed-roundtrip/ManagedRoundTrip.csproj -- \
            research/output/Terraria.Managed.dll \
            research/output/Terraria.Managed.roundtrip.dll
          test -s research/output/Terraria.Managed.roundtrip.dll
          test -s research/output/Terraria.Managed.roundtrip.dll.report.json
          jq -e '.status == "roundtrip-pass-maxstack-normalized" and .sourceFileUnchanged == true and .ilMetadataAndResourcesPreservedExceptMaxStack == true and .maxStackChangesOnlyReduced == true' research/output/Terraria.Managed.roundtrip.dll.report.json

      - name: Independently audit rewritten IL stack depths
        shell: bash
        run: |
          dotnet run --project tools/managed-maxstack-audit/ManagedMaxStackAudit.csproj --             research/output/Terraria.Managed.roundtrip.dll
          test -s research/output/Terraria.Managed.roundtrip.dll.maxstack-audit.json
          jq -e '.status == "maxstack-audit-pass" and .failureCount == 0 and .methodsAnalyzed > 0'             research/output/Terraria.Managed.roundtrip.dll.maxstack-audit.json

      - name: Inventory exact pause-menu patch targets
        shell: bash
        run: |
          dotnet run --project tools/pause-menu-target-audit/PauseMenuTargetAudit.csproj -- \
            research/output/Terraria.Managed.roundtrip.dll \
            research/output/pause-menu-targets.json
          test -s research/output/pause-menu-targets.json
          jq -e '.status == "pause-menu-targets-found"' research/output/pause-menu-targets.json

      - name: Generate read-only pause-menu patch plan
        shell: bash
        run: |
          dotnet run --project tools/pause-menu-patch-planner/PauseMenuPatchPlanner.csproj -- \
            research/output/Terraria.Managed.roundtrip.dll \
            research/output/pause-menu-patch-plan.json
          test -s research/output/pause-menu-patch-plan.json
          jq -e '.status == "dry-run-plan-ready" and .mode == "read-only-dry-run" and .output.writesPatchedAssembly == false and .safety.originalAssemblyNotModified == true and .safety.noPatchedDllProduced == true' research/output/pause-menu-patch-plan.json

      - name: Patch pause coordinate array in separate copy
        shell: bash
        run: |
          dotnet run --project tools/pause-coordinate-patch/PauseCoordinatePatch.csproj -- \
            research/output/Terraria.Managed.roundtrip.dll \
            research/output/Terraria.Managed.pausecoords.dll
          test -s research/output/Terraria.Managed.pausecoords.dll
          test -s research/output/Terraria.Managed.pausecoords.dll.patch-report.json
          jq -e '.status == "pause-coordinate-copy-patch-pass" and .change.previousLength == 7 and .change.newLength == 8 and .change.addedSlot.index == 7 and .validation.sourceFileUnchanged == true and .validation.branchAndExceptionHandlerTargetsValid == true and .safety.originalDllOverwritten == false and .safety.xexProduced == false' research/output/Terraria.Managed.pausecoords.dll.patch-report.json

      - name: Read-only audit of pause uiHeight patch target
        shell: bash
        run: |
          dotnet run --project tools/pause-height-audit/PauseHeightAudit.csproj -- \
            research/output/Terraria.Managed.pausecoords.dll \
            research/output/pause-height-target-audit.json
          test -s research/output/pause-height-target-audit.json
          jq -e '.status == "pause-height-target-audit-pass" and .mode == "read-only-no-patch" and .target.matchCount == 1 and .target.currentHeight == 7 and .safety.sourceFileUnchanged == true and .safety.assemblyWritten == false' research/output/pause-height-target-audit.json

      - name: Read-only audit of pause label insertion point
        shell: bash
        run: |
          dotnet run --project tools/pause-label-audit/PauseLabelAudit.csproj -- \
            research/output/Terraria.Managed.pausecoords.dll \
            research/output/pause-label-anchor-audit.json
          test -s research/output/pause-label-anchor-audit.json
          jq -e '.status == "pause-label-anchor-audit-pass" and .mode == "read-only-no-patch" and .target.matchingSequenceCount == 1 and .target.newRelativeIndex5WriteAlreadyPresent == false and .safety.sourceFileUnchanged == true and .safety.assemblyWritten == false' research/output/pause-label-anchor-audit.json

      - name: Read-only audit of pause selection branch insertion point
        shell: bash
        run: |
          dotnet run --project tools/pause-selection-audit/PauseSelectionAudit.csproj -- \
            research/output/Terraria.Managed.pausecoords.dll \
            research/output/pause-selection-anchor-audit.json
          test -s research/output/pause-selection-anchor-audit.json
          jq -e '.status == "pause-selection-anchor-audit-pass" and .mode == "read-only-no-patch" and .target.existingExitHandlerPreserved == true and .target.newRelativeIndex5HandlerAlreadyPresent == false and .safety.sourceFileUnchanged == true and .safety.assemblyWritten == false' research/output/pause-selection-anchor-audit.json

      - name: Apply first integrated T360 pause-menu patch to a separate DLL
        shell: bash
        run: |
          dotnet run --project tools/pause-menu-integration-patch/PauseMenuIntegrationPatch.csproj -- \
            research/output/Terraria.Managed.pausecoords.dll \
            research/output/Terraria.Managed.t360menu.dll
          test -s research/output/Terraria.Managed.t360menu.dll
          test -s research/output/Terraria.Managed.t360menu.dll.patch-report.json
          jq -e '.status == "pause-menu-integration-copy-patch-pass" and .source.unchanged == true and .validation.controlFlowTargetsValid == true and .safety.originalDllOverwritten == false and .safety.gameXexProduced == false' research/output/Terraria.Managed.t360menu.dll.patch-report.json

      - name: Independently audit integrated T360 menu IL stack depths
        shell: bash
        run: |
          dotnet run --project tools/managed-maxstack-audit/ManagedMaxStackAudit.csproj -- \
            research/output/Terraria.Managed.t360menu.dll
          test -s research/output/Terraria.Managed.t360menu.dll.maxstack-audit.json
          jq -e '.status == "maxstack-audit-pass" and .failureCount == 0 and .methodsAnalyzed > 0' research/output/Terraria.Managed.t360menu.dll.maxstack-audit.json

      - name: Independently audit first patched copy stack depths
        shell: bash
        run: |
          dotnet run --project tools/managed-maxstack-audit/ManagedMaxStackAudit.csproj -- \
            research/output/Terraria.Managed.pausecoords.dll
          test -s research/output/Terraria.Managed.pausecoords.dll.maxstack-audit.json
          jq -e '.status == "maxstack-audit-pass" and .failureCount == 0 and .methodsAnalyzed > 0' research/output/Terraria.Managed.pausecoords.dll.maxstack-audit.json

      - name: Install ILSpy command-line decompiler
        run: dotnet tool install ilspycmd --tool-path tools/ilspy --version 11.1.0.9782

      - name: List Terraria managed types
        shell: bash
        run: |
          tools/ilspy/ilspycmd -l c research/output/Terraria.Managed.dll 2>&1 | tee research/output/managed-types.txt

      - name: Decompile Terraria managed assembly
        shell: bash
        run: |
          tools/ilspy/ilspycmd --disable-updatecheck -p --nested-directories -o research/output/decompiled research/output/Terraria.Managed.dll
          find research/output/decompiled -type f | sort > research/output/decompiled-files.txt
          printf "Decompiled files: " >> research/output/decompilation-summary.txt
          find research/output/decompiled -type f -name '*.cs' | wc -l >> research/output/decompilation-summary.txt
          du -sh research/output/decompiled >> research/output/decompilation-summary.txt

      - name: Inventory Terraria controller bindings
        shell: bash
        run: |
          python3 tools/report_controller_bindings.py research/output/decompiled \
            --json research/output/controller-bindings.json \
            --markdown research/output/controller-bindings.md

      - name: Map Terraria menu integration points
        shell: bash
        run: |
          python3 tools/report_menu_integration_points.py research/output/decompiled \
            --json research/output/menu-integration-points.json \
            --markdown research/output/menu-integration-points.md

      - name: Verify menu render context
        shell: bash
        run: |
          python3 tools/report_menu_render_context.py research/output/decompiled \
            --json research/output/menu-render-context.json \
            --markdown research/output/menu-render-context.md

      - name: Audit pause menu extension capacity
        shell: bash
        run: |
          python3 tools/report_pause_menu_capacity.py research/output/decompiled \
            --json research/output/pause-menu-capacity.json \
            --markdown research/output/pause-menu-capacity.md

      - name: Capture raw IL for Terraria.UI
        shell: bash
        run: |
          tools/ilspy/ilspycmd --ilcode --type Terraria.UI research/output/Terraria.Managed.dll \
            > research/output/Terraria-UI.il
          test -s research/output/Terraria-UI.il
          python3 tools/report_ui_raw_il.py research/output/Terraria-UI.il \
            --json research/output/ui-raw-il.json \
            --markdown research/output/ui-raw-il.md

      - name: Audit exact pause menu IL branches
        shell: bash
        run: |
          python3 tools/audit_pause_menu_il.py research/output/Terraria-UI.il \
            --json research/output/pause-menu-il-audit.json \
            --markdown research/output/pause-menu-il-audit.md

      - name: Inventory managed build references
        shell: bash
        run: |
          PROJECT="$(find research/output/decompiled -type f -name '*.csproj' -print -quit)"
          test -n "$PROJECT" || {
            echo "ILSpy-generated project file was not found."
            exit 1
          }
          python3 tools/report_managed_build_requirements.py "$PROJECT" \
            --json research/output/managed-build-requirements.json \
            --markdown research/output/managed-build-requirements.md

      - name: Read exact CLR AssemblyRef identities
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check dnfile==0.15.1
          python3 tools/report_assembly_refs.py research/output/Terraria.Managed.dll \
            --json research/output/managed-assembly-refs.json \
            --markdown research/output/managed-assembly-refs.md

      - name: Upload analysis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraria-game-exe-analysis
          path: research/output/
          if-no-files-found: warn
          retention-days: 7
