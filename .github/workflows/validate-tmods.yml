name: Validate T360 Mod Packages

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/validate-tmods.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/validate-tmods.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run package validator tests
        run: python -m unittest discover -s tests -v

      - name: Check validator syntax
        run: python -m py_compile tools/validate_tmod.py
